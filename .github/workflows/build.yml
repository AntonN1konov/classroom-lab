name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") } else { $v = "0.1.0" }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Download cloudflared
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/bin | Out-Null
          Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile desktop/bin/cloudflared.exe

      - name: Build executable
        run: pyinstaller desktop/classroom-lab.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test
        run: python desktop/smoke_test.py dist/ClassroomLab/ClassroomLab.exe

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $default = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$default\ISCC.exe")) { choco install innosetup -y --no-progress }
            "${env:ProgramFiles(x86)}\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=$env:APP_VERSION desktop\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ClassroomLab-Setup-windows
          path: dist/ClassroomLab-Setup-*.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClassroomLab-Setup-*.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Download cloudflared
        run: |
          mkdir -p desktop/bin
          curl -fsSL -o desktop/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x desktop/bin/cloudflared

      - name: Build executable
        run: pyinstaller desktop/classroom-lab.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test
        run: python desktop/smoke_test.py dist/ClassroomLab/ClassroomLab

      - name: Package
        run: tar -czf dist/ClassroomLab-linux-x64.tar.gz -C dist ClassroomLab

      - uses: actions/upload-artifact@v4
        with:
          name: ClassroomLab-linux
          path: dist/ClassroomLab-linux-x64.tar.gz
